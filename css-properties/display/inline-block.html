<!DOCTYPE html> <!-- tells the browser this is HTML5 -->
<html> <!-- root of your webpage -->

<head> <!-- This part is not visible on the page. It configures your site. -->
    <meta charset="utf-8"> <!-- Supports all characters -->
    <meta name="description" content="Fundamentals of HTML and CSS"> <!-- Helps SEO -->
    <title>Inline Block</title> <!-- Shows in browser tab -->
    <link rel="icon" href="../../media/images/favicon.ico" type="image/x-icon" sizes="32x32">
    <link rel="stylesheet" href="../style.css"> <!-- Connects your CSS file -->
</head>
<style>
    /*
    Emmet shortcut mt margin top
    Emmet shortcut bgc background color
    Emmet shortcut w width
    Emmet shortcut h height
    Emmet shortcut d:ib display inline block:
    Emmet shortcut bd border shorthand:

    Class selector = .inlineBlock
    Type selector =     div
    Selector list =     inlineBlock, div
    Descendant combinator = .inlineBlock div
    */

    .inlineBlock,
    div {
        display: inline-block;
    }

    /*parent div*/
    .inlineBlock {
        margin-top: 10px;
        background-color: white;
        /******     Change width to 410px for inline example  ******/
        width: 210px;
        height: 205px;
        border: 3px dashed red;
    }

    /****** Child divs ******/
    .inlineBlock div {
        width: 100px;
        height: 100px;
        border: 1px solid #000;
        background-color: aqua;
    }
</style>

<body>

    <h2>Inline-block</h2>

    <p>Inline-block allows other boxes to sit right next to them. <br>
        If the box with this display property does not fit in the
        space available, it will break to a new line.</p>


    <div class="inlineBlock">
        <div>Child Div 1</div>
        <!--    Uncomment the child divs two and three -->
        <div>Child Div 2</div>
        <div>Child Div 3</div>
    </div>
    <br><br>
    <a style=" text-decoration: none; background: #3498db; color: white; padding: 6px 12px; border-radius: 6px; font-size: 14px; 
    transition: 0.2s" class="active" href="../../css-properties/index.html" target="_self" title="Sample Testimonials">Back</a>

</body>

</html>
