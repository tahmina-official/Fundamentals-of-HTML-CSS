<!DOCTYPE html> <!-- tells the browser this is HTML5 -->

<head> <!-- This part is not visible on the page. It configures your site. -->

    <title>Flex Box</title> <!-- Shows in browser tab -->
    <link rel="icon" href="../../media/images/favicon.ico" type="image/x-icon" sizes="32x32">
    <link rel="stylesheet" href="../style.css"> <!-- Connects your CSS file -->

<style>
    .container {
        display: flex;
    }

    .boxes {
        border: .1px solid;
        width: 99px;
        height: 99px;
        text-align: center;
        font-size: 30px;
    }

    #box1 {
        background-color: green;
    }

    #box2 {
        background-color: yellow;
    }

    #box3 {
        background-color: pink;
    }

    #box4 {
        background-color: blue;
    }

    #box5 {
        background-color: red;
    }

    #box6 {
        background-color: orange;
    }

    #box7 {
        background-color: beige;
    }

    #box8 {
        background-color: lightgrey;
    }
</style>
</head>

<body>

    <h1>The Flex model </h1>

    <div class="container">
        <!--     flex items-->
        <div class="boxes" id="box1">1</div>
        <div class="boxes" id="box2">2</div>
        <div class="boxes" id="box3">3</div>
        <div class="boxes" id="box4">4</div>
        <div class="boxes" id="box5">5</div>
        <div class="boxes" id="box6">6</div>
        <div class="boxes" id="box7">7</div>
        <div class="boxes" id="box8">8</div>
    </div>
