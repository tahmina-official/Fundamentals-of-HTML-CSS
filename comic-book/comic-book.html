<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./comic-book-style.css">
</head>

<body>

    <section id="comic">

        <h1>Animation Comic Book</h1>

        <!-- flex container -->
        <div class="row" id="row-1">
            <!-- flex items  -->
            <div class="panel">
                <div class="dialogue">Knock <mark>Knock!</mark></div>
            </div>
            <div class="panel">
                <div class="dialogue">Who's there?</div>
            </div>
            <div class="panel">
                <div class="dialogue">Pika</div>
            </div>
        </div>

        <!-- flex container -->
        <div class="row" id="row-2">
            <!-- flex items  -->
            <div class="panel">
                <div class="dialogue">Pika who?</div>
            </div>
            <div class="panel">
                <div class="dialogue">Pikaboo!</div>
            </div>
            <div class="panel">
                <div class="dialogue">Let’s go, Pikachu!</div>
            </div>
        </div>

    </section>

</body>

</html>
